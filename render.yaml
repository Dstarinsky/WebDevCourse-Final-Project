services:
  - type: web
    name: music-hub
    runtime: node
    region: oregon
    plan: free                
    
    # Dependencies live in the Server/ subfolder, so install there.
    buildCommand: npm install --prefix Server
    startCommand: node Server/server.js

    # Health Check
    healthCheckPath: /

    # Environment Variables
    envVars:
      - key: NODE_VERSION
        value: 20.0.0

      - key: NODE_ENV
        value: production

      - key: SESSION_SECRET
        generateValue: true

      - key: YOUTUBE_API_KEY
        sync: false
